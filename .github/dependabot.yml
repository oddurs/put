version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date, as one
  # grouped pull request a month.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # The digest-pinned Alpine image used for the musl job and Linux releases.
  - package-ecosystem: docker
    directory: /.github/docker
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
