name: release

# Every push to main builds and tests the release binaries (a dry run), so
# packaging problems show up long before a release. Pushing a tag like
# v0.1.0 does the same and then publishes a GitHub release with checksums
# and signed build provenance.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUT_STRICT: "1"

jobs:
  linux:
    name: linux ${{ matrix.arch }} (static, musl)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Timestamps in the tarball come from the commit, not the clock.
      - name: Use the commit time as SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - name: Build the pinned Alpine image
        run: docker build -t put-build -f .github/docker/Dockerfile tests
      - name: Build, test and package
        run: |
          docker run --rm -e PUT_STRICT -e SOURCE_DATE_EPOCH -e TARGET="${{ matrix.arch }}-linux" \
            -v "$PWD:/src" -w /src put-build sh -euc '
            make STATIC=1 CFLAGS=-O2 WERROR=1 test
            make STATIC=1 CFLAGS=-O2 check-hardening
            ! readelf -d build/put | grep -q NEEDED
            make STATIC=1 CFLAGS=-O2 bindist-check
          '
      - name: Rebuild from scratch and compare (reproducible build)
        run: |
          first=$(sha256sum build/dist/*.tar.gz | cut -d' ' -f1)
          docker run --rm -e SOURCE_DATE_EPOCH -e TARGET="${{ matrix.arch }}-linux" \
            -v "$PWD:/src" -w /src put-build sh -euc '
            make BUILD=build/again STATIC=1 CFLAGS=-O2 all
            make BUILD=build/again STATIC=1 CFLAGS=-O2 bindist
          '
          second=$(sha256sum build/again/dist/*.tar.gz | cut -d' ' -f1)
          echo "first:  $first"
          echo "second: $second"
          test "$first" = "$second"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-${{ matrix.arch }}
          path: build/dist/*.tar.gz
          if-no-files-found: error

  macos:
    name: macos universal
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the commit time as SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - run: python3 -m pip install --user --break-system-packages -r tests/requirements.txt
      - name: Build both architectures and test the native one
        run: |
          make BUILD=build/arm64 CFLAGS="-O2 -arch arm64 -mmacosx-version-min=11.0" WERROR=1 test
          make BUILD=build/x86_64 CFLAGS="-O2 -arch x86_64 -mmacosx-version-min=10.15" WERROR=1 all
      - name: Combine into a universal binary
        run: |
          mkdir -p build/universal
          lipo -create -output build/universal/put build/arm64/put build/x86_64/put
          lipo -archs build/universal/put | grep -q x86_64
          lipo -archs build/universal/put | grep -q arm64
      # bindist strips the binary; bindist-check then runs the golden tests
      # on the stripped binary from the tarball, so a broken code signature
      # or a bad strip can't ship unnoticed.
      - run: make BUILD=build/universal TARGET=universal-macos bindist-check
      - name: The x86_64 half runs too, where Rosetta is available
        run: |
          bin="build/universal/dist/check/put-$(make -s print-version)-universal-macos/bin"
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$bin/put.version"
          else
            echo "no Rosetta on this runner; skipped"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos-universal
          path: build/universal/dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match the version in the Makefile
        run: |
          version=$(make -s print-version)
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Makefile VERSION ${version}"
            exit 1
          }
          make check-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Source tarball and checksums
        run: |
          make dist
          cp build/put-*.tar.gz dist/
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from CHANGELOG.md
        run: |
          version=$(make -s print-version)
          # index() matches the heading literally; a regex would treat the
          # dots in the version as wildcards.
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no notes for $version in CHANGELOG.md"; exit 1; }
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "put ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag
