name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: gcc }
          - { os: ubuntu-latest, cc: clang }
          - { os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Build and test
        run: make CC=${{ matrix.cc }} WERROR=1 test

  sanitize:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: make CC=clang WERROR=1 sanitize

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make WERROR=1 valgrind

  lint:
    name: format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18
      - run: make CLANG_FORMAT=clang-format-18 CLANG_TIDY=clang-tidy-18 lint

  install:
    name: install to a staging directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make install DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Installed commands work
        run: |
          export PATH="$PWD/stage/usr/bin:$PATH"
          test "$(put -n)" = "-n"
          put.peek $'tab\there'
          test -f stage/usr/share/man/man1/put.1
