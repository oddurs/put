name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Tests that would otherwise skip when a tool is missing (zsh, the regex
  # package) fail instead, so CI never passes by testing less.
  PUT_STRICT: "1"

# Actions are pinned to full commit SHAs so a moved tag can't change what
# runs here. Dependabot keeps the pins current.

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux x86_64 gcc, os: ubuntu-24.04, cc: gcc }
          - { name: linux x86_64 clang, os: ubuntu-24.04, cc: clang }
          - { name: linux arm64 gcc, os: ubuntu-24.04-arm, cc: gcc }
          # macOS also tests put.quote against its /bin/bash 3.2, and the
          # full-terminal test exercises the select() wait on a real tty.
          - { name: macos arm64 clang, os: macos-latest, cc: clang }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install Python test dependencies
        run: python3 -m pip install --user --break-system-packages -r tests/requirements.txt
      - name: Build and test
        run: make CC=${{ matrix.cc }} WERROR=1 test
      - name: Check hardening
        if: runner.os == 'Linux'
        run: make CC=${{ matrix.cc }} check-hardening

  musl:
    name: test (alpine musl, static)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the pinned Alpine image
        run: docker build -t put-build -f .github/docker/Dockerfile tests
      - name: Build and test in Alpine
        run: |
          docker run --rm -e PUT_STRICT -v "$PWD:/src" -w /src put-build sh -euc '
            make WERROR=1 test
            make check-hardening
            make clean
            make STATIC=1 WERROR=1 test
            make STATIC=1 check-hardening
            ! readelf -d build/put | grep -q NEEDED
          '

  freebsd:
    name: test (freebsd)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          envs: PUT_STRICT
          usesh: true
          # pip's package name carries the Python version (py311-pip,
          # py312-pip, ...), so ask the installed python3 which one it is.
          prepare: |
            pkg install -y bash gmake python3 zsh
            pkg install -y "py$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')-pip"
          run: |
            uname -a
            python3 -m pip install --break-system-packages -r tests/requirements.txt
            gmake WERROR=1 test

  sanitize:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python3 -m pip install --user --break-system-packages -r tests/requirements.txt
      - run: make CC=clang WERROR=1 sanitize

  valgrind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: make WERROR=1 valgrind

  analyze:
    name: gcc -fanalyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make analyze

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y zsh && pipx install gcovr
      - run: python3 -m pip install --user --break-system-packages -r tests/requirements.txt
      - run: make CC=gcc coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat build/cov/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: build/cov/*.html

  fuzz:
    name: fuzz (libFuzzer, 3 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make WERROR=1 FUZZ_TIME=180 fuzz
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*

  lint:
    name: format, clang-tidy, shellcheck, man page, tables
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-format-18 clang-tidy-18 mandoc shellcheck
      - run: python3 -m pip install --user --break-system-packages -r tests/requirements.txt
      - run: make CLANG_FORMAT=clang-format-18 CLANG_TIDY=clang-tidy-18 lint
      - name: Generated Unicode tables are up to date
        run: make check-unicode
      - name: Lint workflow files
        run: pipx run --spec actionlint-py actionlint

  install:
    name: install to a staging directory
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parallel install from a clean tree
        run: make -j8 install DESTDIR="$PWD/stage" PREFIX=/usr
      - name: Installed commands work
        run: |
          export PATH="$PWD/stage/usr/bin:$PATH"
          test "$(put -n)" = "-n"
          put.version
          put.peek $'tab\there'
          test -f stage/usr/share/man/man1/put.1
      - name: Uninstall removes everything
        run: |
          make uninstall DESTDIR="$PWD/stage" PREFIX=/usr
          test -z "$(find stage -type f -o -type l)"
